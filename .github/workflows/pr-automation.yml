name: Pull Request Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        continue-on-error: true

      - name: Run ESLint
        id: eslint
        run: |
          if npm run lint 2>&1 | tee eslint-output.txt; then
            echo "eslint_status=passed" >> $GITHUB_OUTPUT
            echo "eslint_result=✅ ESLint checks passed" >> $GITHUB_OUTPUT
          else
            echo "eslint_status=failed" >> $GITHUB_OUTPUT
            echo "eslint_result=❌ ESLint checks failed" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Run Prettier
        id: prettier
        run: |
          if npx prettier --check . 2>&1 | tee prettier-output.txt; then
            echo "prettier_status=passed" >> $GITHUB_OUTPUT
            echo "prettier_result=✅ Prettier formatting checks passed" >> $GITHUB_OUTPUT
          else
            echo "prettier_status=failed" >> $GITHUB_OUTPUT
            echo "prettier_result=❌ Prettier formatting checks failed" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Post Code Quality Report
        uses: actions/github-script@v7
        with:
          script: |
            const eslintResult = '${{ steps.eslint.outputs.eslint_result }}' || '⚠️ ESLint not configured';
            const prettierResult = '${{ steps.prettier.outputs.prettier_result }}' || '⚠️ Prettier not configured';
            
            const comment = `## Code Quality Report
            
            ### ESLint
            ${eslintResult}
            
            ### Prettier
            ${prettierResult}
            
            ---
            *Automated code quality check completed*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  testing-suite:
    name: testing-suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        continue-on-error: true

      - name: Run tests with coverage
        id: test
        run: |
          if npm test -- --coverage 2>&1 | tee test-output.txt; then
            echo "test_status=passed" >> $GITHUB_OUTPUT
          else
            echo "test_status=failed" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Generate coverage summary
        id: coverage
        run: |
          if [ -f coverage/lcov-report/index.html ]; then
            echo "coverage_available=true" >> $GITHUB_OUTPUT
            # Extract basic coverage info if available
            if [ -f coverage/coverage-summary.json ]; then
              COVERAGE=$(cat coverage/coverage-summary.json | grep -o '"total":{[^}]*}' | head -1)
              echo "coverage_data=$COVERAGE" >> $GITHUB_OUTPUT
            fi
          else
            echo "coverage_available=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
        continue-on-error: true

      - name: Post Test Coverage Report
        uses: actions/github-script@v7
        with:
          script: |
            const testStatus = '${{ steps.test.outputs.test_status }}' || 'unknown';
            const coverageAvailable = '${{ steps.coverage.outputs.coverage_available }}' === 'true';
            
            let statusEmoji = testStatus === 'passed' ? '✅' : testStatus === 'failed' ? '❌' : '⚠️';
            let statusText = testStatus === 'passed' ? 'All tests passed' : testStatus === 'failed' ? 'Some tests failed' : 'Test status unknown';
            
            const comment = `## Test Coverage Report
            
            ${statusEmoji} **${statusText}**
            
            ${coverageAvailable ? '📊 Coverage report generated and uploaded as artifact' : '⚠️ Coverage data not available'}
            
            ---
            *Automated test suite completed*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        continue-on-error: true

      - name: Run npm audit
        id: audit
        run: |
          if npm audit --audit-level=moderate --json > audit-results.json 2>&1; then
            echo "vulnerabilities=none" >> $GITHUB_OUTPUT
            echo "audit_result=✅ No vulnerabilities found" >> $GITHUB_OUTPUT
          else
            VULNS=$(cat audit-results.json | grep -o '"total":[0-9]*' | head -1 | cut -d':' -f2 || echo "unknown")
            echo "vulnerabilities=$VULNS" >> $GITHUB_OUTPUT
            echo "audit_result=⚠️ Vulnerabilities detected" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Check for secrets
        id: secrets
        run: |
          # Simple secret scanning using git diff and common patterns
          SECRETS_FOUND=false
          
          # Check for common secret patterns in changes
          if git diff origin/main...HEAD | grep -iE '(password|secret|key|token|api_key).*=.*[a-zA-Z0-9]{16,}' > secrets-found.txt 2>&1; then
            SECRETS_FOUND=true
            echo "secrets_status=found" >> $GITHUB_OUTPUT
            echo "secrets_result=⚠️ Potential secrets detected in changes" >> $GITHUB_OUTPUT
          else
            echo "secrets_status=clean" >> $GITHUB_OUTPUT
            echo "secrets_result=✅ No secrets detected" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Post Security Scan Report
        uses: actions/github-script@v7
        with:
          script: |
            const auditResult = '${{ steps.audit.outputs.audit_result }}' || '⚠️ Audit not completed';
            const secretsResult = '${{ steps.secrets.outputs.secrets_result }}' || '⚠️ Secret scan not completed';
            const vulns = '${{ steps.audit.outputs.vulnerabilities }}' || '0';
            
            const comment = `## Security Scan Report
            
            ### Dependencies
            ${auditResult}
            ${vulns !== 'none' && vulns !== '0' ? `- **Vulnerabilities**: ${vulns} found` : ''}
            
            ### Secrets Scan
            ${secretsResult}
            
            ---
            *Automated security scan completed*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  build-validation:
    name: build-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        continue-on-error: true

      - name: Build application
        id: build
        run: |
          if npm run build 2>&1 | tee build-output.txt; then
            echo "build_status=success" >> $GITHUB_OUTPUT
            echo "build_result=✅ Build completed successfully" >> $GITHUB_OUTPUT
          else
            # Try alternative build commands
            if [ -f package.json ] && grep -q '"build"' package.json; then
              echo "build_status=failed" >> $GITHUB_OUTPUT
              echo "build_result=❌ Build failed" >> $GITHUB_OUTPUT
            else
              echo "build_status=skipped" >> $GITHUB_OUTPUT
              echo "build_result=⚠️ No build script configured" >> $GITHUB_OUTPUT
            fi
          fi
        continue-on-error: true

      - name: Validate endpoints
        id: validate
        run: |
          # Check if there's a start script and validate basic structure
          if [ -f package.json ]; then
            if grep -q '"start"' package.json || grep -q '"dev"' package.json; then
              echo "validation_result=✅ Application structure validated" >> $GITHUB_OUTPUT
            else
              echo "validation_result=⚠️ No start script found" >> $GITHUB_OUTPUT
            fi
          else
            echo "validation_result=⚠️ No package.json found" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Create deployment preview
        run: |
          mkdir -p preview
          echo "# Deployment Preview" > preview/README.md
          echo "Build completed at $(date)" >> preview/README.md
          echo "Commit: ${{ github.sha }}" >> preview/README.md
          if [ -d dist ]; then cp -r dist preview/ 2>/dev/null || true; fi
          if [ -d build ]; then cp -r build preview/ 2>/dev/null || true; fi
        continue-on-error: true

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-preview
          path: preview/
          retention-days: 7
        continue-on-error: true

      - name: Post Build Validation
        uses: actions/github-script@v7
        with:
          script: |
            const buildResult = '${{ steps.build.outputs.build_result }}' || '⚠️ Build not attempted';
            const validationResult = '${{ steps.validate.outputs.validation_result }}' || '⚠️ Validation not completed';
            
            const comment = `## Build Validation
            
            ${buildResult}
            
            ${validationResult}
            
            📦 Deployment preview artifacts uploaded
            
            ---
            *Automated build validation completed*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });