name: Pull Request Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: |
          echo "Running ESLint checks..."
          npm run lint 2>&1 | tee eslint-results.txt || true
          ESLINT_EXIT_CODE=${PIPESTATUS[0]}
          echo "eslint_exit_code=$ESLINT_EXIT_CODE" >> $GITHUB_OUTPUT
          
          if [ -s eslint-results.txt ]; then
            echo "eslint_output<<EOF" >> $GITHUB_OUTPUT
            cat eslint-results.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "eslint_output=No ESLint issues found" >> $GITHUB_OUTPUT
          fi

      - name: Run Prettier check
        id: prettier
        run: |
          echo "Running Prettier formatting checks..."
          npx prettier --check . 2>&1 | tee prettier-results.txt || true
          PRETTIER_EXIT_CODE=${PIPESTATUS[0]}
          echo "prettier_exit_code=$PRETTIER_EXIT_CODE" >> $GITHUB_OUTPUT
          
          if [ -s prettier-results.txt ]; then
            echo "prettier_output<<EOF" >> $GITHUB_OUTPUT
            cat prettier-results.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "prettier_output=All files are properly formatted" >> $GITHUB_OUTPUT
          fi

      - name: Post Code Quality Report
        uses: actions/github-script@v7
        with:
          script: |
            const eslintExitCode = '${{ steps.eslint.outputs.eslint_exit_code }}';
            const prettierExitCode = '${{ steps.prettier.outputs.prettier_exit_code }}';
            const eslintOutput = `${{ steps.eslint.outputs.eslint_output }}`;
            const prettierOutput = `${{ steps.prettier.outputs.prettier_output }}`;
            
            const eslintStatus = eslintExitCode === '0' ? '✅ Passed' : '❌ Failed';
            const prettierStatus = prettierExitCode === '0' ? '✅ Passed' : '❌ Failed';
            
            const comment = `## Code Quality Report
            
            ### ESLint
            **Status:** ${eslintStatus}
            
            <details>
            <summary>ESLint Details</summary>
            
            \`\`\`
            ${eslintOutput}
            \`\`\`
            </details>
            
            ### Prettier
            **Status:** ${prettierStatus}
            
            <details>
            <summary>Prettier Details</summary>
            
            \`\`\`
            ${prettierOutput}
            \`\`\`
            </details>
            
            ---
            *Generated by PR Automation Workflow*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  testing-suite:
    name: testing-suite
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        id: test
        run: |
          echo "Running test suite..."
          npm test 2>&1 | tee test-results.txt || true
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "test_exit_code=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT
          
          # Try to generate coverage if available
          if npm run test:coverage 2>/dev/null; then
            echo "coverage_generated=true" >> $GITHUB_OUTPUT
          else
            echo "coverage_generated=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -s test-results.txt ]; then
            echo "test_output<<EOF" >> $GITHUB_OUTPUT
            head -100 test-results.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/
            test-results.txt
          retention-days: 7

      - name: Post Test Coverage Report
        uses: actions/github-script@v7
        with:
          script: |
            const testExitCode = '${{ steps.test.outputs.test_exit_code }}';
            const coverageGenerated = '${{ steps.test.outputs.coverage_generated }}';
            const testOutput = `${{ steps.test.outputs.test_output }}` || 'No test output available';
            
            const testStatus = testExitCode === '0' ? '✅ Passed' : '❌ Failed';
            const coverageStatus = coverageGenerated === 'true' ? 'Generated' : 'Not available';
            
            const comment = `## Test Coverage Report
            
            **Test Status:** ${testStatus}
            **Coverage:** ${coverageStatus}
            
            <details>
            <summary>Test Results</summary>
            
            \`\`\`
            ${testOutput}
            \`\`\`
            </details>
            
            Coverage artifacts have been uploaded and are available for download.
            
            ---
            *Generated by PR Automation Workflow*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run dependency vulnerability check
        id: audit
        run: |
          echo "Checking for vulnerabilities in dependencies..."
          npm audit --audit-level=moderate 2>&1 | tee audit-results.txt || true
          AUDIT_EXIT_CODE=${PIPESTATUS[0]}
          echo "audit_exit_code=$AUDIT_EXIT_CODE" >> $GITHUB_OUTPUT
          
          # Count vulnerabilities
          VULN_COUNT=$(grep -c "vulnerabilities" audit-results.txt || echo "0")
          echo "vuln_count=$VULN_COUNT" >> $GITHUB_OUTPUT
          
          if [ -s audit-results.txt ]; then
            echo "audit_output<<EOF" >> $GITHUB_OUTPUT
            head -150 audit-results.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "audit_output=No audit results" >> $GITHUB_OUTPUT
          fi

      - name: Scan for secrets in code changes
        id: secrets
        run: |
          echo "Scanning for secrets in code changes..."
          
          # Get changed files
          git diff --name-only origin/main...HEAD > changed-files.txt || true
          
          # Simple secret patterns check
          SECRETS_FOUND=0
          SECRET_DETAILS=""
          
          # Check for common secret patterns
          if grep -r -i -E "(api[_-]?key|secret|password|token|private[_-]?key)\s*[:=]\s*['\"][^'\"]{8,}['\"]" --include="*.js" --include="*.json" --include="*.env*" . 2>/dev/null | grep -v node_modules | head -20 > secrets-found.txt; then
            SECRETS_FOUND=$(wc -l < secrets-found.txt)
            SECRET_DETAILS=$(head -10 secrets-found.txt)
          fi
          
          echo "secrets_found=$SECRETS_FOUND" >> $GITHUB_OUTPUT
          
          if [ "$SECRETS_FOUND" -gt 0 ]; then
            echo "secrets_output<<EOF" >> $GITHUB_OUTPUT
            echo "$SECRET_DETAILS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "secrets_output=No secrets detected in code" >> $GITHUB_OUTPUT
          fi

      - name: Post Security Scan Report
        uses: actions/github-script@v7
        with:
          script: |
            const auditExitCode = '${{ steps.audit.outputs.audit_exit_code }}';
            const auditOutput = `${{ steps.audit.outputs.audit_output }}`;
            const secretsFound = '${{ steps.secrets.outputs.secrets_found }}';
            const secretsOutput = `${{ steps.secrets.outputs.secrets_output }}`;
            
            const vulnStatus = auditExitCode === '0' ? '✅ No vulnerabilities found' : '⚠️ Vulnerabilities detected';
            const secretsStatus = secretsFound === '0' ? '✅ No secrets found' : '❌ Potential secrets detected';
            
            const comment = `## Security Scan Report
            
            ### Vulnerabilities
            **Dependencies Status:** ${vulnStatus}
            
            <details>
            <summary>Vulnerability Scan Details</summary>
            
            \`\`\`
            ${auditOutput}
            \`\`\`
            </details>
            
            ### Secrets Scan
            **Secrets Status:** ${secretsStatus}
            **Potential Secrets Found:** ${secretsFound}
            
            <details>
            <summary>Secrets Scan Details</summary>
            
            \`\`\`
            ${secretsOutput}
            \`\`\`
            </details>
            
            ### Dependencies
            All dependencies have been scanned for known vulnerabilities.
            
            ---
            *Generated by PR Automation Workflow*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  build-validation:
    name: build-validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        id: build
        run: |
          echo "Building application..."
          if npm run build 2>&1 | tee build-results.txt; then
            echo "build_success=true" >> $GITHUB_OUTPUT
            echo "build_status=✅ Build successful" >> $GITHUB_OUTPUT
          else
            echo "build_success=false" >> $GITHUB_OUTPUT
            echo "build_status=❌ Build failed" >> $GITHUB_OUTPUT
          fi
          
          if [ -s build-results.txt ]; then
            echo "build_output<<EOF" >> $GITHUB_OUTPUT
            tail -50 build-results.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Validate endpoints
        id: validate
        run: |
          echo "Validating application endpoints..."
          
          # Start the app in background if there's a start script
          if npm run start --if-present &>/dev/null & then
            APP_PID=$!
            sleep 5
            
            # Try to check if app is running
            if curl -s http://localhost:3000/health 2>/dev/null || curl -s http://localhost:3000 2>/dev/null; then
              echo "endpoints accessible=true" >> $GITHUB_OUTPUT
              echo "endpoint_status=✅ Endpoints accessible" >> $GITHUB_OUTPUT
            else
              echo "endpoints accessible=false" >> $GITHUB_OUTPUT
              echo "endpoint_status=⚠️ Could not validate endpoints (app may not be configured for validation)" >> $GITHUB_OUTPUT
            fi
            
            kill $APP_PID 2>/dev/null || true
          else
            echo "endpoints accessible=skipped" >> $GITHUB_OUTPUT
            echo "endpoint_status=⚠️ Endpoint validation skipped (no start script)" >> $GITHUB_OUTPUT
          fi

      - name: Create deployment preview artifacts
        run: |
          echo "Creating deployment preview artifacts..."
          mkdir -p deployment-preview
          
          # Copy relevant files
          cp -r package.json package-lock.json deployment-preview/ 2>/dev/null || true
          cp -r dist/ build/ deployment-preview/ 2>/dev/null || true
          
          # Create preview info
          cat > deployment-preview/preview-info.txt << EOF
          Deployment Preview
          ==================
          Branch: ${{ github.head_ref }}
          Commit: ${{ github.sha }}
          Built at: $(date)
          PR Number: ${{ github.event.pull_request.number }}
          EOF
          
          tar -czf deployment-preview.tar.gz deployment-preview/

      - name: Upload deployment preview
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-preview
          path: deployment-preview.tar.gz
          retention-days: 7

      - name: Post Build Validation
        uses: actions/github-script@v7
        with:
          script: |
            const buildStatus = '${{ steps.build.outputs.build_status }}';
            const buildOutput = `${{ steps.build.outputs.build_output }}` || 'No build output';
            const endpointStatus = '${{ steps.validate.outputs.endpoint_status }}';
            
            const comment = `## Build Validation
            
            **Build Status:** ${buildStatus}
            **Endpoint Validation:** ${endpointStatus}
            
            <details>
            <summary>Build Details</summary>
            
            \`\`\`
            ${buildOutput}
            \`\`\`
            </details>
            
            Deployment preview artifacts have been created and uploaded.
            
            ---
            *Generated by PR Automation Workflow*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });